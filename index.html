<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compreendendo a Desigualdade Social</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Desigualdade Social</h1>
    <button id="theme-toggle" class="btn">Modo Escuro</button>
  </header>

  <main>
    <section class="card">
      <h2>O que é Desigualdade Social?</h2>
      <p>A desigualdade social é um processo histórico e cultural onde ocorre a distribuição desigual de renda, oportunidades, acesso à saúde, educação e moradia entre diferentes grupos da sociedade.</p>
      
      <div class="actions">
        <button id="like-btn" class="btn-like">
          ❤️ Curtir (<span id="like-count">0</span>)
        </button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
