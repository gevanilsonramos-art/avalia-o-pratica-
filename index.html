  <header>
    <h1>Combate ao Racismo</h1>
    <button id="theme-toggle" class="btn">Modo Escuro</button>
  </header>

  <main>
    <section class="card">
      <img src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=600&q=80" alt="Pessoas unidas em conscientização" class="card-img">
      
      <h2>O que é o Racismo Estrutural?</h2>
      <p>O racismo é uma forma de discriminação que hierarquiza povos e culturas. Na forma estrutural, ele se manifesta através de práticas, hábitos e costumes enraizados nas instituições e na sociedade, perpetuando a desigualdade.</p>
      
      <div class="actions">
        <button id="like-btn" class="btn-like">
          ✊🏿 Apoiar Causa (<span id="like-count">0</span>)
        </button>
      </div>
    </section>
  </main>
