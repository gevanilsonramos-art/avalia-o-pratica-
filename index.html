<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conscientização e Combate ao Racismo</title>
  <style>
    :root {
      --bg-color: #f8f9fa;
      --text-color: #212529;
      --card-bg: #ffffff;
      --primary-color: #1a1a1a;
      --btn-bg: #343a40;
      --btn-text: #ffffff;
    }

    body.dark-mode {
      --bg-color: #121212;
      --text-color: #f8f9fa;
      --card-bg: #1e1e1e;
      --primary-color: #ffffff;
      --btn-bg: #e0e0e0;
      --btn-text: #121212;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      transition: background-color 0.3s, color 0.3s;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background-color: var(--card-bg);
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    header h1 {
      color: var(--primary-color);
      margin: 0;
      font-size: 1.5rem;
    }

    main {
      display: flex;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background-color: var(--card-bg);
      padding: 2rem;
      border-radius: 8px;
      max-width: 600px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .card-img {
      width: 100%;
      height: auto;
      border-radius: 6px;
      margin-bottom: 1rem;
    }

    .card h2 {
      color: var(--primary-color);
      margin-top: 0;
    }

    .card p {
      line-height: 1.6;
    }

    .btn {
      background-color: var(--btn-bg);
      color: var(--btn-text);
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: bold;
    }

    .btn-like {
      background-color: #2b2b2b;
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 20px;
      cursor: pointer;
      font-size: 1rem;
      margin-top: 1rem;
      transition: transform 0.1s;
    }

    .btn-like:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>
  <header>
    <h1>Combate ao Racismo</h1>
    <button id="theme-toggle" class="btn">Modo Escuro</button>
  </header>
